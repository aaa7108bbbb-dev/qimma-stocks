<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>قمة الأسهم</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --navy: #0f1b2d; --navy-light: #1a2d47; --navy-dark: #0a1220;
  --gold: #c8922a; --gold-light: #e0b85c; --gold-dim: rgba(200,146,42,0.15);
  --green: #00c853; --green-bg: rgba(0,200,83,0.1);
  --red: #ff1744; --red-bg: rgba(255,23,68,0.1);
  --gray: #8899aa; --gray-light: #c5d0db;
  --bg: #f4f5f7; --card: #ffffff; --card-border: #e8ecf0;
  --text: #1a2332; --text-secondary: #5a6a7a;
  --font: 'Tajawal', sans-serif;
  --radius: 14px; --radius-sm: 8px;
  --shadow: 0 2px 12px rgba(15,27,45,0.06);
  --nav-height: 64px; --header-height: 56px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100dvh;overflow-x:hidden;padding-bottom:calc(var(--nav-height)+16px);padding-top:var(--header-height)}
button{font-family:var(--font);cursor:pointer;border:none;background:none}
input,select{font-family:var(--font)}

.app-header{position:fixed;top:0;left:0;right:0;height:var(--header-height);background:var(--navy);display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:100;box-shadow:0 2px 16px rgba(0,0,0,0.2)}
.app-header .logo{display:flex;align-items:center;gap:8px;color:var(--gold);font-weight:800;font-size:18px}
.app-header .logo svg{width:28px;height:28px}
.tasi-mini{display:flex;align-items:center;gap:8px;color:#fff;font-size:13px;font-weight:500}
.tasi-mini .val{font-weight:700;font-size:15px}
.tasi-mini .chg{font-size:12px;padding:2px 6px;border-radius:4px;font-weight:700}
.tasi-mini .chg.up{background:var(--green-bg);color:var(--green)}
.tasi-mini .chg.down{background:var(--red-bg);color:var(--red)}
.header-status{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--gray);font-weight:500}
.status-dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.status-dot.open{background:var(--green);box-shadow:0 0 6px var(--green)}
.status-dot.closed{background:var(--red)}

.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-height);background:var(--card);border-top:1px solid var(--card-border);display:flex;align-items:center;justify-content:space-around;z-index:100;padding-bottom:env(safe-area-inset-bottom,0);box-shadow:0 -2px 16px rgba(0,0,0,0.04)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;font-weight:500;color:var(--gray);padding:6px 0;transition:color 0.2s;-webkit-tap-highlight-color:transparent}
.nav-item.active{color:var(--gold)}
.nav-item svg{width:22px;height:22px;stroke-width:1.75}

.page{display:none;padding:12px}
.page.active{display:block}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--card-border);box-shadow:var(--shadow);overflow:hidden}

.quick-cards{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.quick-cards::-webkit-scrollbar{display:none}
.quick-card{scroll-snap-align:start;min-width:140px;flex-shrink:0;background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-sm);padding:12px;display:flex;flex-direction:column;gap:6px}
.qc-title{font-size:11px;color:var(--text-secondary);font-weight:500;display:flex;align-items:center;gap:4px}
.qc-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.qc-price{font-size:15px;font-weight:800}
.qc-change{font-size:12px;font-weight:700}

.search-bar{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:10px}
.search-bar svg{width:18px;height:18px;color:var(--gray);flex-shrink:0}
.search-bar input{flex:1;border:none;outline:none;font-size:14px;background:transparent;color:var(--text)}
.search-bar input::placeholder{color:var(--gray-light)}

.sector-chips{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sector-chips::-webkit-scrollbar{display:none}
.sector-chip{white-space:nowrap;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;border:1px solid var(--card-border);background:var(--card);color:var(--text-secondary);transition:all 0.2s}
.sector-chip.active{background:var(--navy);color:#fff;border-color:var(--navy)}

.stock-table{width:100%;overflow-x:auto}
.stock-table table{width:100%;border-collapse:collapse;font-size:13px}
.stock-table th{position:sticky;top:0;background:var(--bg);color:var(--text-secondary);font-weight:600;font-size:11px;padding:8px 6px;text-align:right;border-bottom:2px solid var(--card-border);cursor:pointer;user-select:none;white-space:nowrap}
.stock-table th:hover{color:var(--gold)}
.stock-table td{padding:10px 6px;text-align:right;border-bottom:1px solid var(--card-border);white-space:nowrap}
.stock-table tbody tr:active{background:var(--gold-dim)}
.stock-name{display:flex;flex-direction:column}
.stock-name .sn-name{font-weight:700;font-size:12px}
.stock-name .sn-symbol{font-size:11px;color:var(--gray)}
.td-up{color:var(--green);font-weight:700}
.td-down{color:var(--red);font-weight:700}
.td-flat{color:var(--gray)}

.section-title{font-size:15px;font-weight:700;margin:16px 0 8px;color:var(--text);display:flex;align-items:center;gap:6px}
.section-title svg{width:18px;height:18px;color:var(--gold)}

.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:12px;color:var(--text-secondary);font-size:14px}
.spinner{width:36px;height:36px;border:3px solid var(--card-border);border-top-color:var(--gold);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.market-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.ms-box{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-sm);padding:10px;text-align:center}
.ms-box .ms-label{font-size:10px;color:var(--text-secondary);font-weight:500}
.ms-box .ms-val{font-size:16px;font-weight:800;margin-top:2px}
.ms-box .ms-sub{font-size:11px;font-weight:600;margin-top:2px}

.coming-soon{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;gap:16px;text-align:center}
.coming-soon svg{width:64px;height:64px;color:var(--gold-light)}
.coming-soon h2{font-size:20px;color:var(--text)}
.coming-soon p{font-size:14px;color:var(--text-secondary);max-width:280px}

.refresh-btn{display:flex;align-items:center;gap:4px;background:var(--gold-dim);color:var(--gold);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:600}
.refresh-btn svg{width:14px;height:14px}

.flex-between{display:flex;align-items:center;justify-content:space-between}
.text-green{color:var(--green)}.text-red{color:var(--red)}.text-gold{color:var(--gold)}.fw700{font-weight:700}

/* Screener preset cards */
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.preset-card{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-sm);padding:14px 12px;cursor:pointer;transition:all 0.2s;-webkit-tap-highlight-color:transparent}
.preset-card:active{transform:scale(0.97);border-color:var(--gold)}
.preset-card.active-preset{border-color:var(--gold);background:var(--gold-dim)}
.preset-card .pc-icon{font-size:20px;margin-bottom:4px}
.preset-card .pc-title{font-size:13px;font-weight:700}
.preset-card .pc-desc{font-size:10px;color:var(--text-secondary);margin-top:2px}
.preset-card .pc-count{font-size:12px;font-weight:700;color:var(--gold);margin-top:4px}

/* Stock detail modal */
.stock-detail{position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;background:var(--bg);overflow-y:auto;padding:16px;padding-top:60px}
.sd-close{position:fixed;top:12px;left:12px;z-index:201;background:var(--card);border:1px solid var(--card-border);border-radius:50%;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:var(--shadow)}
.sd-header{text-align:center;margin-bottom:16px}
.sd-header .sd-name{font-size:20px;font-weight:800}
.sd-header .sd-symbol{font-size:14px;color:var(--gray)}
.sd-price-box{text-align:center;margin-bottom:16px}
.sd-price-box .sd-price{font-size:36px;font-weight:900}
.sd-price-box .sd-change{font-size:16px;font-weight:700;margin-top:4px}
.sd-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.sd-item{background:var(--card);border:1px solid var(--card-border);border-radius:var(--radius-sm);padding:10px;text-align:center}
.sd-item .sd-label{font-size:10px;color:var(--text-secondary)}
.sd-item .sd-val{font-size:14px;font-weight:700;margin-top:2px}
</style>
</head>

.tasi-m .val{font-weight:700;font-size:15px}

.chg.up{background:var(--green-bg);color:var(--green)}
.chg.dn{background:var(--red-bg);color:var(--red)}
.hdr-st{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--gray);font-weight:500}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}

.ni.act{color:var(--gold)}.ni svg{width:22px;height:22px;stroke-width:1.75}

.pg{display:none;padding:12px}.pg.act{display:block}
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--card-border);box-shadow:var(--shadow);overflow:hidden}

.qc-n{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}

.qc-c{font-size:12px;font-weight:700}

.flx{display:flex;align-items:center;justify-content:space-between}

.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}

.pc-i{font-size:20px;margin-bottom:4px}
.pc-t{font-size:13px;font-weight:700}
.pc-d{font-size:10px;color:var(--text-sec);margin-top:2px}
.pc-c{font-size:12px;font-weight:700;color:var(--gold);margin-top:4px}

function ChartPage({initSym}){

  useEffect(function(){if(initSym){sSym(initSym)}},[initSym]);

  function loadChart(symbol,interval){
    if(!symbol||!symbol.trim())return;
    sLd(true);
    Promise.all([StockAPI.quote(symbol.trim()),StockAPI.hist(symbol.trim(),interval||'1d').catch(function(){return{data:[]}})]).then(function(r){
      sData(r[0]);
      var hist=r[1].data||r[1].historical||[];
      renderChart(hist,r[0]);
      sLd(false);
    }).catch(function(e){console.error(e);sLd(false)});
  }

  useEffect(function(){if(initSym)loadChart(initSym,tf)},[initSym]);

  function renderChart(hist,quote){
    if(!chartRef.current||!hist.length)return;
    // Destroy old chart
    if(chartInst.current){try{chartInst.current.remove()}catch(e){}}
    chartRef.current.innerHTML='';

    var chart=LightweightCharts.createChart(chartRef.current,{
      width:chartRef.current.offsetWidth,height:300,
      layout:{background:{type:'solid',color:'#ffffff'},textColor:'#5a6a7a',fontFamily:'Tajawal'},

      return{time:d.date||d.timestamp,open:d.open,high:d.high,low:d.low,close:d.close};
    }).filter(function(d){return d.time&&d.open&&d.high&&d.low&&d.close}).sort(function(a,b){return a.time<b.time?-1:1});

    // Heikin Ashi calculation
    var candles=[];
    for(var j=0;j<raw.length;j++){
      var r=raw[j];
      var haClose=(r.open+r.high+r.low+r.close)/4;
      var haOpen=j===0?(r.open+r.close)/2:(candles[j-1].open+candles[j-1].close)/2;
      var haHigh=Math.max(r.high,haOpen,haClose);
      var haLow=Math.min(r.low,haOpen,haClose);
      candles.push({time:r.time,open:haOpen,high:haHigh,low:haLow,close:haClose});
    }

    if(candles.length>0){
      var series=chart.addCandlestickSeries({
        upColor:'#00c853',downColor:'#ff1744',borderDownColor:'#00c853',borderUpColor:'#00c853',
        wickDownColor:'#ff1744',wickUpColor:'#00c853',
        borderVisible:false
      });
      series.setData(candles);
      seriesRef.current=series;
      chart.timeScale().fitContent();

      // Volume
      var volSeries=chart.addHistogramSeries({
        color:'#c8922a33',priceFormat:{type:'volume'},priceScaleId:'vol'
      });
      chart.priceScale('vol').applyOptions({scaleMargins:{top:0.85,bottom:0}});
      var volData=hist.map(function(d){
        return{time:d.date||d.timestamp,value:d.volume||0,color:d.close>=d.open?'rgba(0,200,83,0.3)':'rgba(255,23,68,0.3)'};
      }).filter(function(d){return d.time}).sort(function(a,b){return a.time<b.time?-1:1});
      if(volData.length)volSeries.setData(volData);
    }

    // Resize
    var ro=new ResizeObserver(function(){if(chartRef.current)chart.applyOptions({width:chartRef.current.offsetWidth})});
    ro.observe(chartRef.current);
  }

  function changeTf(iv){sTf(iv);if(sym)loadChart(sym,iv)}

      React.createElement('button',{className:'rbtn',style:{padding:'8px 16px'},onClick:function(){loadChart(sym,tf)}},'عرض')

    React.createElement('div',{className:'tf-btns'},

    React.createElement('div',{id:'chart-box',ref:chartRef}),

        )
